name: wisdom_app
description: A minimal wisdom app
publish_to: "none"

version: 1.0.0+30
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  in_app_purchase: ^3.2.0
  in_app_review: ^2.0.12
  url_launcher: ^6.3.1
  share_plus: ^13.2.1
  pdf: ^3.13.0
  printing: ^5.15.0
  flutter_local_notifications: ^22.1.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1

  shared_preferences: ^2.2.2
  audioplayers: ^6.6.0
  uuid: ^4.5.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter

  in_app_purchase_platform_interface: ^1.4.1
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/fonts/licenses/
    - assets/fonts/glyphs/

  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Variable.ttf
          weight: 400
        - asset: assets/fonts/EBGaramond-Italic-Variable.ttf
          weight: 400
          style: italic
    - family: NotoSerifJP
      fonts:
        - asset: assets/fonts/NotoSerifJP-Regular.ttf
          weight: 400
    - family: NotoSerifKR
      fonts:
        - asset: assets/fonts/NotoSerifKR-Regular.ttf
          weight: 400
    - family: NotoSerifTC
      fonts:
        - asset: assets/fonts/NotoSerifTC-Regular.ttf
          weight: 400
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
    - family: NotoSerifThai
      fonts:
        - asset: assets/fonts/NotoSerifThai-Regular.ttf
          weight: 400

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
