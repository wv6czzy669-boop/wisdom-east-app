name: wisdom_app
description: A minimal wisdom app
publish_to: "none"

version: 2.0.0+46
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  characters: ^1.4.0
  crypto: ^3.0.7
  in_app_purchase: ^3.3.0
  in_app_review: ^2.0.12
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  pdf: ^3.13.0
  printing: ^5.15.0
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1

  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  uuid: ^4.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter

  in_app_purchase_platform_interface: ^1.4.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/fonts/NotoEmoji-Regular.ttf
    - assets/fonts/NotoSerifJP-Regular.ttf
    - assets/fonts/NotoSerifKR-Regular.ttf
    - assets/fonts/NotoSerifTC-Regular.ttf
    - assets/fonts/licenses/

  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Variable.ttf
          weight: 400
    - family: NotoSerifJP
      fonts:
        - asset: assets/fonts/NotoSerifJP-App.ttf
          weight: 400
    - family: NotoSerifKR
      fonts:
        - asset: assets/fonts/NotoSerifKR-App.ttf
          weight: 400
    - family: NotoSerifTC
      fonts:
        - asset: assets/fonts/NotoSerifTC-App.ttf
          weight: 400
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
    - family: NotoSerifThai
      fonts:
        - asset: assets/fonts/NotoSerifThai-Regular.ttf
          weight: 400

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
